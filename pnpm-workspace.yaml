packages:
  - '.'

engineStrict: true
# Use the pinned version when an external reviewer starts with another pnpm release.
pmOnFail: download
# Review sandboxes may move an installed tree; frozen installs validate dependency freshness.
verifyDepsBeforeRun: false

overrides:
  moment: 2.31.0
  # Drop only the stale peer; retain the plugin's own Obsidian 1.12.3 dependency as npm resolved it.
  eslint-plugin-obsidianmd@0.4.2>obsidian@1.8.7: '-'

# Keep build approvals scoped to the reviewed package versions.
strictDepBuilds: true
allowBuilds:
  esbuild@0.28.2: true
  fsevents@2.3.3: true
